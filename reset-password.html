<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nouveau mot de passe - GTA MAP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #0d1117;
      color: white;

      font-family: Arial, sans-serif;
    }

    .box {
      width: 420px;
      max-width: 92%;

      padding: 30px;

      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #8b949e;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;

      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 12px;

      color: white;
      background: #0d1117;

      border: 1px solid #30363d;
      border-radius: 7px;

      font-size: 16px;
    }

    button {
      width: 100%;

      margin-top: 22px;
      padding: 13px;

      border: 0;
      border-radius: 7px;

      background: #238636;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      color: #f2cc60;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Nouveau mot de passe</h1>

    <p>
      Choisis un nouveau mot de passe pour ton compte administrateur.
    </p>

    <form id="password-form">

      <label for="password">
        Nouveau mot de passe
      </label>

      <input
        id="password"
        type="password"
        minlength="8"
        required
      >

      <label for="password-confirm">
        Confirmer le mot de passe
      </label>

      <input
        id="password-confirm"
        type="password"
        minlength="8"
        required
      >

      <button type="submit">
        Modifier le mot de passe
      </button>

      <div id="message">
        Vérification du lien...
      </div>

    </form>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>

  <script src="js/supabase-client.js"></script>


  <script>

    const form =
      document.getElementById("password-form");

    const message =
      document.getElementById("message");


    // Supabase récupère automatiquement
    // la session contenue dans le lien envoyé par email.

    db.auth.onAuthStateChange(
      (event, session) => {

        console.log(
          "Auth event:",
          event
        );

        if (
          event === "PASSWORD_RECOVERY" ||
          session
        ) {

          message.textContent =
            "Lien valide. Tu peux choisir ton nouveau mot de passe.";

        }

      }
    );


    form.addEventListener(
      "submit",

      async (event) => {

        event.preventDefault();


        const password =
          document.getElementById(
            "password"
          ).value;


        const confirm =
          document.getElementById(
            "password-confirm"
          ).value;


        if (password !== confirm) {

          message.textContent =
            "Les deux mots de passe ne correspondent pas.";

          return;

        }


        message.textContent =
          "Modification en cours...";


        const {
          data,
          error
        } =
          await db.auth.updateUser({

            password: password

          });


        if (error) {

          message.textContent =
            "Erreur : " + error.message;

          return;

        }


        message.textContent =
          "Mot de passe modifié. Redirection...";


        setTimeout(
          () => {

            window.location.href =
              "login.html";

          },
          1500
        );

      }
    );

  </script>

</body>
</html>
