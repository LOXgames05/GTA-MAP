<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GTA MAP</title>


<!-- LEAFLET -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>


<!-- LEAFLET GEOMAN -->
<link
  rel="stylesheet"
  href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css"
>


<!-- ICONES -->
<script src="https://unpkg.com/lucide@latest"></script>


<style>

/* =========================================================
   ROOT
========================================================= */

* {
  box-sizing: border-box;
}

:root {

  --bg: #050807;

  --panel:
    rgba(8, 13, 11, .94);

  --border:
    rgba(140, 177, 155, .13);

  --border-strong:
    rgba(140, 177, 155, .25);

  --green:
    #86ad96;

  --green-light:
    #a7c4b2;

  --gold:
    #c6a443;

  --gold-light:
    #e3c868;

  --red:
    #c95a5a;

  --text:
    #edf2ef;

  --muted:
    #87928c;

  --top-height:
    72px;

  --left-panel:
    366px;

  --right-panel:
    320px;

  --panel-gap:
    18px;

}


html,
body {

  width: 100%;
  height: 100%;

  margin: 0;

  overflow: hidden;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


body::before {

  content: "";

  position: fixed;

  inset: 0;

  z-index: 0;

  pointer-events: none;

  background:

    radial-gradient(
      circle at 65% 10%,
      rgba(41, 92, 69, .15),
      transparent 35%
    ),

    radial-gradient(
      circle at 15% 85%,
      rgba(26, 75, 53, .12),
      transparent 35%
    );

}



/* =========================================================
   MAP
========================================================= */

#map {

  position: fixed;

  inset: 0;

  z-index: 1;

  background:
    #070a09;

}


.leaflet-container {

  background:
    #070a09;

}



/* =========================================================
   HEADER
========================================================= */

#topbar {

  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  z-index: 9000;

  height:
    var(--top-height);

  display: grid;

  grid-template-columns:
    290px 1fr auto;

  align-items: center;

  padding:
    0 22px;

  border-bottom:
    1px solid var(--border);

  background:
    rgba(3, 6, 5, .96);

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.3);

}



/* =========================================================
   BRAND
========================================================= */

.brand {

  display: flex;

  align-items: center;

  gap: 13px;

}


.brand-emblem {

  width: 38px;
  height: 38px;

  display: grid;

  place-items: center;

  border:
    1px solid rgba(198,164,67,.35);

  border-radius:
    50%;

  color:
    var(--gold);

  background:
    radial-gradient(
      circle,
      rgba(198,164,67,.12),
      rgba(198,164,67,.02)
    );

}


.brand-emblem svg {

  width: 19px;
  height: 19px;

}


.brand-name {

  font-size: 13px;

  font-weight: 800;

  letter-spacing: 3px;

}


.brand-sub {

  margin-top: 2px;

  color:
    var(--muted);

  font-size: 9px;

  letter-spacing: 1px;

}



/* =========================================================
   NAV
========================================================= */

.main-nav {

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 28px;

}


.nav-item {

  position: relative;

  height: 100%;

  display: flex;

  align-items: center;

  color:
    #89908d;

  font-size: 10px;

  font-weight: 800;

  letter-spacing: 2px;

  cursor: pointer;

  user-select: none;

}


.nav-item:hover {

  color: white;

}


.nav-item.active {

  color:
    var(--green-light);

}


.nav-item.active::after {

  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 2px;

  background:
    var(--green);

}



/* =========================================================
   ACCOUNT
========================================================= */

.account-area {

  display: flex;

  align-items: center;

  justify-content: flex-end;

  gap: 8px;

}


#admin-email {

  max-width: 170px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  color:
    var(--muted);

  font-size: 10px;

}



/* =========================================================
   BUTTONS
========================================================= */

button {

  appearance: none;

  min-height: 38px;

  border:
    1px solid var(--border);

  border-radius: 9px;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 7px;

  padding:
    8px 12px;

  background:
    rgba(20, 28, 24, .9);

  color:
    #dce5e0;

  font-family: inherit;

  font-size: 10px;

  font-weight: 750;

  cursor: pointer;

  transition:
    .15s ease;

}


button svg {

  width: 15px;
  height: 15px;

}


button:hover {

  border-color:
    var(--border-strong);

  background:
    rgba(33, 46, 39, .96);

  color: white;

}


button:active {

  transform:
    scale(.975);

}


button.primary {

  background:
    rgba(43, 77, 59, .9);

  border-color:
    rgba(134,173,150,.3);

  color:
    #c9ded1;

}


button.gold {

  background:
    rgba(117, 92, 26, .19);

  border-color:
    rgba(198,164,67,.38);

  color:
    var(--gold-light);

}


button.danger {

  background:
    rgba(112, 34, 34, .12);

  border-color:
    rgba(201,90,90,.25);

  color:
    #e88484;

}


button.active {

  border-color:
    rgba(134,173,150,.55);

  background:
    rgba(43,77,59,.95);

  color: white;

}


button:disabled {

  opacity: .32;

  cursor:
    not-allowed;

  transform:
    none;

}



/* =========================================================
   PANELS
========================================================= */

.panel {

  position: fixed;

  z-index: 6000;

  overflow: hidden;

  border:
    1px solid var(--border);

  border-radius: 13px;

  background:
    linear-gradient(
      145deg,
      rgba(7,12,10,.97),
      rgba(10,18,14,.94)
    );

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 22px 65px rgba(0,0,0,.46);

}


.panel-header {

  min-height: 56px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 16px;

  border-bottom:
    1px solid var(--border);

}


.panel-kicker {

  color:
    var(--muted);

  font-size: 8px;

  font-weight: 800;

  letter-spacing: 2px;

}


.panel-title {

  margin-top: 3px;

  font-size: 15px;

  font-weight: 750;

}


.panel-scroll {

  overflow-y: auto;

}


.panel-scroll::-webkit-scrollbar {

  width: 5px;

}


.panel-scroll::-webkit-scrollbar-thumb {

  border-radius: 999px;

  background:
    rgba(134,173,150,.2);

}



/* =========================================================
   LAYERS
========================================================= */

#layers-panel {

  top:
    calc(var(--top-height) + 18px);

  right:
    var(--panel-gap);

  width:
    var(--right-panel);

  max-height:
    calc(
      100vh
      - var(--top-height)
      - 36px
    );

}


#layers-panel.closed {

  display: none;

}


#layers-panel .panel-scroll {

  max-height:
    calc(
      100vh
      - var(--top-height)
      - 108px
    );

  padding: 12px;

}


#layers-list {

  display: grid;

  gap: 7px;

}


.layer-item {

  display: grid;

  grid-template-columns:
    18px 10px 1fr auto;

  align-items: center;

  gap: 10px;

  min-height: 48px;

  padding:
    8px 11px;

  border:
    1px solid rgba(255,255,255,.045);

  border-radius: 9px;

  background:
    rgba(255,255,255,.018);

  cursor: pointer;

}


.layer-item:hover {

  background:
    rgba(81,118,96,.08);

}


.layer-item input {

  width: 15px;
  height: 15px;

  margin: 0;

  accent-color:
    var(--green);

}


.layer-swatch {

  width: 9px;
  height: 9px;

  border-radius: 50%;

  box-shadow:
    0 0 7px currentColor;

}


.layer-name {

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 11px;

  font-weight: 650;

}


.layer-count {

  min-width: 24px;

  padding:
    3px 6px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.035);

  color:
    var(--muted);

  text-align: center;

  font-size: 9px;

}



/* =========================================================
   EDITOR
========================================================= */

#editor-panel {

  top:
    calc(var(--top-height) + 18px);

  left:
    var(--panel-gap);

  width:
    var(--left-panel);

  max-height:
    calc(
      100vh
      - var(--top-height)
      - 36px
    );

  display: none;

}


body.editing #editor-panel {

  display: block;

}


#editor-panel .panel-scroll {

  max-height:
    calc(
      100vh
      - var(--top-height)
      - 108px
    );

  padding: 16px;

}


.editor-section {

  padding-bottom: 18px;

  margin-bottom: 18px;

  border-bottom:
    1px solid var(--border);

}


.editor-section:last-child {

  margin-bottom: 0;

  border-bottom: 0;

}


.section-head {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 12px;

}


.section-name {

  color:
    #b8c5be;

  font-size: 9px;

  font-weight: 800;

  letter-spacing: 2px;

}



/* =========================================================
   STATUS
========================================================= */

#status {

  padding:
    11px 12px;

  border:
    1px solid rgba(134,173,150,.14);

  border-radius: 9px;

  background:
    rgba(48,81,62,.09);

  color:
    #9db7a7;

  font-size: 10px;

  line-height: 1.5;

}



/* =========================================================
   FORMS
========================================================= */

label {

  display: block;

  margin:
    11px 0 5px;

  color:
    #89968f;

  font-size: 8px;

  font-weight: 800;

  letter-spacing: 1.4px;

  text-transform: uppercase;

}


input,
select,
textarea {

  width: 100%;

  min-height: 40px;

  padding:
    9px 11px;

  border:
    1px solid var(--border);

  border-radius: 8px;

  outline: none;

  background:
    rgba(4,8,6,.88);

  color:
    #e5ece8;

  font-family: inherit;

  font-size: 11px;

}


input:focus,
select:focus,
textarea:focus {

  border-color:
    rgba(134,173,150,.42);

}


textarea {

  min-height: 74px;

  resize: vertical;

}


input[type="color"] {

  height: 40px;

  padding: 4px;

}


input[type="range"] {

  min-height: 30px;

  padding: 0;

  accent-color:
    var(--green);

}


.form-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

}


.check-row {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 12px;

  color:
    #a4afa9;

  font-size: 10px;

}


.check-row input {

  width: 15px;

  min-height: 15px;

  accent-color:
    var(--green);

}



/* =========================================================
   ACTIONS
========================================================= */

.action-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 7px;

  margin-top: 13px;

}


.action-grid .wide {

  grid-column:
    1 / -1;

}



/* =========================================================
   DRAW TOOLBAR
========================================================= */

#draw-toolbar {

  position: fixed;

  z-index: 8000;

  bottom: 18px;

  left:
    calc(
      var(--left-safe, 0px)
      +
      (
        100vw
        - var(--left-safe, 0px)
        - var(--right-safe, 0px)
      ) / 2
    );

  transform:
    translateX(-50%);

  display: none;

  align-items: stretch;

  gap: 4px;

  padding: 6px;

  border:
    1px solid var(--border);

  border-radius: 12px;

  background:
    rgba(5,9,7,.96);

  backdrop-filter:
    blur(16px);

  box-shadow:
    0 18px 50px rgba(0,0,0,.55);

}


body.editing #draw-toolbar {

  display: flex;

}


body.editing {

  --left-safe:
    calc(
      var(--left-panel)
      + var(--panel-gap)
      + 18px
    );

}


body.layers-open {

  --right-safe:
    calc(
      var(--right-panel)
      + var(--panel-gap)
      + 18px
    );

}


.draw-tool {

  width: 76px;

  min-height: 54px;

  display: flex;

  flex-direction: column;

  gap: 4px;

  padding: 6px;

  border:
    1px solid transparent;

  background:
    transparent;

  color:
    #909b95;

}


.draw-tool svg {

  width: 18px;
  height: 18px;

}


.draw-tool:hover {

  border-color:
    var(--border);

  background:
    rgba(63,94,75,.1);

  color: white;

}


.draw-tool.active {

  border-color:
    rgba(134,173,150,.3);

  background:
    rgba(49,84,64,.28);

  color:
    var(--green-light);

}


.draw-label {

  font-size: 8px;

  font-weight: 800;

  letter-spacing: .5px;

}


.toolbar-separator {

  width: 1px;

  margin:
    7px 4px;

  background:
    var(--border);

}



/* =========================================================
   ZOOM
========================================================= */

.leaflet-bottom.leaflet-right {

  right:
    calc(
      var(--right-safe, 0px)
      + 14px
    );

  bottom: 14px;

}


.leaflet-control-zoom {

  overflow: hidden;

  border:
    1px solid var(--border) !important;

  border-radius:
    10px !important;

  box-shadow:
    0 12px 35px rgba(0,0,0,.42) !important;

}


.leaflet-control-zoom a {

  width:
    38px !important;

  height:
    38px !important;

  line-height:
    38px !important;

  border:
    0 !important;

  background:
    rgba(6,10,8,.96) !important;

  color:
    var(--green-light) !important;

}



/* =========================================================
   LOGIN
========================================================= */

#login-overlay {

  position: fixed;

  inset: 0;

  z-index: 12000;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:
    blur(12px);

}


#login-overlay.visible {

  display: flex;

}


.login-box {

  width: 410px;

  max-width: 100%;

  overflow: hidden;

  border:
    1px solid var(--border);

  border-radius: 14px;

  background:
    linear-gradient(
      145deg,
      #080d0a,
      #0d1511
    );

  box-shadow:
    0 35px 100px rgba(0,0,0,.7);

}


.login-head {

  padding: 22px;

  border-bottom:
    1px solid var(--border);

}


.login-kicker {

  margin-bottom: 7px;

  color:
    var(--green);

  font-size: 8px;

  font-weight: 900;

  letter-spacing: 2px;

}


.login-title {

  margin: 0;

  font-size: 21px;

}


.login-sub {

  margin:
    6px 0 0;

  color:
    var(--muted);

  font-size: 10px;

}


.login-body {

  padding:
    20px 22px 22px;

}


#login-error {

  margin-top: 12px;

  color:
    #d6bd68;

  font-size: 10px;

}



/* =========================================================
   POPUPS
========================================================= */

.leaflet-popup-content-wrapper {

  border:
    1px solid var(--border);

  border-radius: 10px;

  background:
    rgba(6,11,8,.97);

  color: white;

}


.leaflet-popup-tip {

  background:
    rgba(6,11,8,.97);

}


.zone-category {

  margin-bottom: 5px;

  color:
    var(--green);

  font-size: 7px;

  font-weight: 900;

  letter-spacing: 1.6px;

  text-transform: uppercase;

}


.zone-title {

  margin:
    0 0 5px;

  font-size: 15px;

}


.zone-description {

  margin: 0;

  color:
    var(--muted);

  font-size: 10px;

}



/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {

  #topbar {

    grid-template-columns:
      1fr auto;

  }

  .main-nav {

    display: none;

  }

}


@media (max-width: 760px) {

  :root {

    --top-height:
      62px;

  }


  #topbar {

    padding:
      0 10px;

  }


  .brand-name {

    font-size: 10px;

  }


  .brand-sub,
  #admin-email {

    display: none;

  }


  .brand-emblem {

    width: 32px;
    height: 32px;

  }


  #layers-panel {

    top: 74px;

    right: 8px;

    width: 245px;

    max-height: 44vh;

  }


  #editor-panel {

    top: auto;

    left: 8px;
    right: 8px;

    bottom: 78px;

    width: auto;

    max-height: 50vh;

  }


  #draw-toolbar {

    left: 8px !important;
    right: 8px;

    bottom: 8px;

    transform: none;

    overflow-x: auto;

  }


  body.editing {

    --left-safe: 0px;

  }


  body.layers-open {

    --right-safe: 0px;

  }


  .leaflet-bottom.leaflet-right {

    right: 8px;

    bottom: 78px;

  }

}

</style>

</head>



<body class="layers-open">


<!-- MAP -->

<div id="map"></div>



<!-- HEADER -->

<header id="topbar">

  <div class="brand">

    <div class="brand-emblem">

      <i data-lucide="compass"></i>

    </div>


    <div>

      <div class="brand-name">
        GTA MAP
      </div>

      <div class="brand-sub">
        TERRITORIAL INTELLIGENCE
      </div>

    </div>

  </div>



  <nav class="main-nav">

    <div
      id="nav-map"
      class="nav-item active"
    >
      CARTE
    </div>


    <div
      id="nav-layers"
      class="nav-item"
    >
      COUCHES
    </div>


    <div
      id="nav-editor"
      class="nav-item"
      style="display:none;"
    >
      ÉDITION
    </div>

  </nav>



  <div class="account-area">

    <span id="admin-email"></span>


    <button id="reset-map">

      <i data-lucide="scan"></i>

      Centrer

    </button>


    <button id="login-button">

      <i data-lucide="lock-keyhole"></i>

      Admin

    </button>


    <button
      id="edit-mode-button"
      class="primary"
      style="display:none;"
    >

      <i data-lucide="pen-tool"></i>

      Éditer

    </button>


    <button
      id="logout-button"
      class="danger"
      style="display:none;"
    >

      <i data-lucide="log-out"></i>

    </button>

  </div>

</header>



<!-- LAYERS -->

<aside
  id="layers-panel"
  class="panel"
>

  <div class="panel-header">

    <div>

      <div class="panel-kicker">
        AFFICHAGE
      </div>

      <div class="panel-title">
        Couches cartographiques
      </div>

    </div>


    <button id="close-layers">

      <i data-lucide="x"></i>

    </button>

  </div>


  <div class="panel-scroll">

    <div id="layers-list">
      Chargement...
    </div>

  </div>

</aside>



<!-- EDITOR -->

<aside
  id="editor-panel"
  class="panel"
>

  <div class="panel-header">

    <div>

      <div class="panel-kicker">
        ADMINISTRATION
      </div>

      <div class="panel-title">
        Éditeur territorial
      </div>

    </div>


    <i
      data-lucide="shield-check"
      style="
        color:#86ad96;
        width:18px;
      "
    ></i>

  </div>


  <div class="panel-scroll">


    <section class="editor-section">

      <div class="section-head">

        <span class="section-name">
          ÉTAT
        </span>

      </div>


      <div id="status">
        Initialisation...
      </div>

    </section>



    <section class="editor-section">

      <div class="section-head">

        <span class="section-name">
          ÉLÉMENT SÉLECTIONNÉ
        </span>

      </div>


      <label>
        Couche
      </label>

      <select id="shape-layer"></select>


      <label>
        Nom
      </label>

      <input
        id="shape-name"
        type="text"
        placeholder="Ex. Vinewood Hills"
      >


      <label>
        Description
      </label>

      <textarea
        id="shape-description"
        placeholder="Description optionnelle..."
      ></textarea>


      <div class="form-grid">

        <div>

          <label>
            Couleur
          </label>

          <input
            id="shape-color"
            type="color"
            value="#86ad96"
          >

        </div>


        <div>

          <label>
            Opacité
          </label>

          <input
            id="shape-opacity"
            type="range"
            min="0"
            max=".85"
            step=".05"
            value=".30"
          >

        </div>

      </div>


      <label class="check-row">

        <input
          id="shape-published"
          type="checkbox"
          checked
        >

        Visible publiquement

      </label>


      <div class="action-grid">


        <button
          id="save-shape"
          class="primary wide"
          disabled

/* =========================================================

/* =========================================================
   INNER OUTLINE SYSTEM

   Le stroke Leaflet est normalement centré.

   Ici on crée un masque SVG identique au polygone.
   Tout ce qui dépasse à l'extérieur est coupé.

   Ça fonctionne :
   - sur les zones sauvegardées
   - pendant la création
   - pendant un snap
   - pendant la modification des sommets
========================================================= */

const SVG_NS =
  "http://www.w3.org/2000/svg";


const innerClipRegistry =
  new Map();


let innerClipId =
  0;


let globalClipFrame =
  null;



function isAreaLayer(
  layer
) {

  return (
    layer instanceof L.Polygon
  );

}



/* =========================================================
   DESTROY CLIP
========================================================= */

function destroyInnerOutline(
  layer
) {

  const record =
    innerClipRegistry.get(
      layer
    );


  if (!record) {
    return;
  }


  if (
    record.path
  ) {

    record.path.removeAttribute(
      "clip-path"
    );

  }


  if (
    record.clipPath &&
    record.clipPath.isConnected
  ) {

    record.clipPath.remove();

  }


  innerClipRegistry.delete(
    layer
  );

}



/* =========================================================
   INSTALL CLIP
========================================================= */

function installInnerOutline(
  layer
) {

  if (
    !isAreaLayer(
      layer
    )
  ) {
    return;
  }


  const path =
    layer._path;


  if (
    !path ||
    !path.ownerSVGElement
  ) {
    return;
  }


  const svg =
    path.ownerSVGElement;


  let record =
    innerClipRegistry.get(
      layer
    );


  /*
    Leaflet / Geoman peut remplacer
    complètement le PATH SVG.
  */

  if (
    record &&
    record.path !== path
  ) {

    destroyInnerOutline(
      layer
    );


    record =
      null;

  }


  if (!record) {


    let defs =
      svg.querySelector(
        "defs[data-gta-inner-outline='true']"
      );


    if (!defs) {

      defs =
        document.createElementNS(
          SVG_NS,
          "defs"
        );


      defs.setAttribute(
        "data-gta-inner-outline",
        "true"
      );


      svg.insertBefore(
        defs,
        svg.firstChild
      );

    }


    const id =
      "gta-inner-" +
      (++innerClipId);


    const clipPath =
      document.createElementNS(
        SVG_NS,
        "clipPath"
      );


    clipPath.setAttribute(
      "id",
      id
    );


    clipPath.setAttribute(
      "clipPathUnits",
      "userSpaceOnUse"
    );


    const clipShape =
      document.createElementNS(
        SVG_NS,
        "path"
      );


    clipShape.setAttribute(
      "fill",
      "#ffffff"
    );


    clipShape.setAttribute(
      "stroke",
      "none"
    );


    clipShape.setAttribute(
      "fill-rule",
      "evenodd"
    );


    clipShape.setAttribute(
      "clip-rule",
      "evenodd"
    );


    clipPath.appendChild(
      clipShape
    );


    defs.appendChild(
      clipPath
    );


    record = {

      id,
      path,
      clipPath,
      clipShape

    };


    innerClipRegistry.set(
      layer,
      record
    );

  }


  path.setAttribute(
    "clip-path",
    `url(#${record.id})`
  );


  syncInnerOutline(
    layer
  );

}



/* =========================================================
   SYNC ONE CLIP
========================================================= */

function syncInnerOutline(
  layer
) {

  if (
    !isAreaLayer(
      layer
    )
  ) {
    return;
  }


  const path =
    layer._path;


  if (!path) {
    return;
  }


  let record =
    innerClipRegistry.get(
      layer
    );


  if (
    !record ||
    record.path !== path
  ) {

    installInnerOutline(
      layer
    );


    record =
      innerClipRegistry.get(
        layer
      );

  }


  if (!record) {
    return;
  }


  const d =
    path.getAttribute(
      "d"
    );


  if (!d) {
    return;
  }


  record.clipShape.setAttribute(
    "d",
    d
  );


  /*
    Geoman peut retirer l'attribut,
    on le réapplique systématiquement.
  */

  path.setAttribute(
    "clip-path",
    `url(#${record.id})`
  );


  path.setAttribute(
    "stroke-linejoin",
    "round"
  );


  path.setAttribute(
    "stroke-linecap",
    "round"
  );

}



/* =========================================================
   SCHEDULE CLIP

   Plusieurs passages car Geoman effectue parfois
   plusieurs redraws après un événement.
========================================================= */

function scheduleInnerOutline(
  layer
) {

  if (
    !isAreaLayer(
      layer
    )
  ) {
    return;
  }


  requestAnimationFrame(
    () => {

      installInnerOutline(
        layer
      );


      syncInnerOutline(
        layer
      );

    }
  );


  setTimeout(
    () => {

      installInnerOutline(
        layer
      );


      syncInnerOutline(
        layer
      );

    },
    35
  );


  setTimeout(
    () => {

      installInnerOutline(
        layer
      );


      syncInnerOutline(
        layer
      );

    },
    100
  );


  setTimeout(
    () => {

      installInnerOutline(
        layer
      );


      syncInnerOutline(
        layer
      );

    },
    220
  );

}



/* =========================================================
   SYNC ALL
========================================================= */

function syncAllInnerOutlines() {

  if (
    globalClipFrame
  ) {
    return;
  }


  globalClipFrame =
    requestAnimationFrame(
      () => {

        globalClipFrame =
          null;


        for (
          const layer
          of innerClipRegistry.keys()
        ) {

          syncInnerOutline(
            layer
          );

        }

      }
    );

}



/* =========================================================
   CLEAR CLIPS
========================================================= */

function clearInnerClips() {

  const layers =
    Array.from(
      innerClipRegistry.keys()
    );


  for (
    const layer
    of layers
  ) {

    destroyInnerOutline(
      layer
    );

  }

}



/* =========================================================
   IMAGE
========================================================= */

const MAP_IMAGE =
  window.APP_CONFIG.MAP_IMAGE;


function loadImageSize(
  src
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () => {

          resolve({

            width:
              image.naturalWidth,

            height:
              image.naturalHeight

          });

        };


      image.onerror =
        () => {

          reject(
            new Error(
              "Impossible de charger la carte."
            )
          );

        };


      image.src =
        src + "?v=100";

    }
  );

}



/* =========================================================
   MAP
========================================================= */

const imageSize =
  await loadImageSize(
    MAP_IMAGE
  );


initialBounds = [

  [0, 0],

  [
    imageSize.height,
    imageSize.width
  ]

];


map =
  L.map(
    "map",
    {

      crs:
        L.CRS.Simple,

      minZoom:
        -6,

      maxZoom:
        5,

      zoomSnap:
        .25,

      attributionControl:
        false,

      zoomControl:
        false

    }
  );


L.control
  .zoom({

    position:
      "bottomright"

  })
  .addTo(
    map
  );


L.imageOverlay(

  MAP_IMAGE + "?v=100",

  initialBounds,

  {

    interactive:
      false,

    pmIgnore:
      true

  }

).addTo(
  map
);


map.fitBounds(
  initialBounds
);


map.setMaxBounds(
  [

    [
      -imageSize.height,
      -imageSize.width
    ],

    [
      imageSize.height * 2,
      imageSize.width * 2
    ]

  ]
);



/* =========================================================
   MAP REDRAW
========================================================= */

map.on(
  "zoom move resize viewreset",
  syncAllInnerOutlines
);


map.on(
  "zoomend moveend",
  () => {

    for (
      const layer
      of innerClipRegistry.keys()
    ) {

      scheduleInnerOutline(
        layer
      );

    }

  }
);



/* =========================================================
   SNAP
========================================================= */

map.pm.setGlobalOptions({

  snappable:
    true,

  snapDistance:
    30,

  snapVertex:
    true,

  snapSegment:
    true,

  snapMiddle:
    false,

  allowSelfIntersection:
    false

});



/* =========================================================
   CRITICAL FIX:
   INNER OUTLINE WHILE DRAWING

   Geoman utilise un workingLayer temporaire.
   C'était lui qui remettait le contour centré.
========================================================= */

map.on(
  "pm:drawstart",
  event => {

    const workingLayer =
      event.workingLayer;


    if (
      !isAreaLayer(
        workingLayer
      )
    ) {
      return;
    }


    const refresh =
      () => {

        scheduleInnerOutline(
          workingLayer
        );

      };


    requestAnimationFrame(
      refresh
    );


    workingLayer.on(
      "add",
      refresh
    );


    workingLayer.on(
      "pm:vertexadded",
      refresh
    );


    workingLayer.on(
      "pm:change",
      refresh
    );


    workingLayer.on(
      "pm:snap",
      refresh
    );


    workingLayer.on(
      "pm:unsnap",
      refresh
    );


    workingLayer.on(
      "pm:markerdrag",
      refresh
    );

  }
);



/* =========================================================
   RESET MAP
========================================================= */

document
  .getElementById(
    "reset-map"
  )

    "click",
    () => {

      map.fitBounds(

    }

/* =========================================================
   DRAWING TOOLS
========================================================= */

function clearToolActive() {

  document
    .querySelectorAll(
      ".draw-tool"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );

}



function stopDrawing() {

  map.pm.disableDraw();


  clearToolActive();

}



function startDrawing(
  type,
  button
) {

  if (
    !editMode
  ) {
    return;
  }


  stopDrawing();


  button.classList.add(
    "active"
  );


  const isArea =
    type === "Polygon" ||
    type === "Rectangle";


  map.pm.enableDraw(

    type,

    {

      snappable:
        true,

      snapDistance:
        30,

      snapVertex:
        true,

      snapSegment:
        true,

      snapMiddle:
        false,

      allowSelfIntersection:
        false,


      templineStyle: {

        color:
          "#86ad96",

        weight:
          2,

        dashArray:
          "4,5"

      },


      hintlineStyle: {

        color:
          "#86ad96",

        weight:
          2,

        dashArray:
          "4,5"

      },


      pathOptions: {

        color:
          "#86ad96",

        fillColor:
          "#86ad96",

        fillOpacity:
          isArea
            ? .25
            : 0,

        /*
          6px total.
          Avec le masque, environ 3px restent visibles
          À L'INTÉRIEUR.
        */

        weight:
          isArea
            ? 6
            : 3,

        lineJoin:
          "round",

        lineCap:
          "round"

      }

    }

  );

}



document
  .getElementById(
    "draw-polygon"
  )
  .addEventListener(
    "click",
    event => {

      startDrawing(
        "Polygon",
        event.currentTarget
      );

    }
  );


document
  .getElementById(
    "draw-rectangle"
  )

document
  .getElementById(
    "draw-line"
  )
  .addEventListener(
    "click",
    event => {

      startDrawing(
        "Line",
        event.currentTarget
      );

    }
  );


document
  .getElementById(
    "stop-drawing"
  )
  .addEventListener(
    "click",
    stopDrawing
  );



/* =========================================================
   DATABASE
========================================================= */

async function loadDatabase() {

  let layersQuery =
    db
      .from(
        "map_layers"
      )
      .select("*")
      .order(
        "sort_order"
      )
      .order(
        "name"
      );


  let shapesQuery =
    db
      .from(
        "map_shapes"
      )
      .select("*")
      .order(
        "created_at"
      );


  if (
    !admin ||
    !editMode
  ) {

    layersQuery =
      layersQuery.eq(
        "visible",
        true
      );


    shapesQuery =
      shapesQuery.eq(
        "published",
        true
      );

  }


  const [
    layersResponse,
    shapesResponse
  ] =
    await Promise.all(
      [

        layersQuery,

        shapesQuery

      ]
    );


  if (
    layersResponse.error
  ) {

    console.error(
      layersResponse.error
    );


    if (
      editMode
    ) {

      status.textContent =
        "Erreur couches : " +
        layersResponse.error.message;

    }


    return;

  }


  if (
    shapesResponse.error
  ) {

    console.error(
      shapesResponse.error
    );


    if (
      editMode
    ) {

      status.textContent =
        "Erreur zones : " +
        shapesResponse.error.message;

    }


    return;

  }


  mapLayers =
    layersResponse.data ||
    [];


  mapShapes =
    shapesResponse.data ||
    [];


  renderLayers();


  renderShapes();


  updateShapeLayerSelect();


  if (
    editMode
  ) {

    status.textContent =
      `${mapLayers.length} couche(s) • ${mapShapes.length} élément(s)`;

  }

}



/* =========================================================
   CLEAR GROUPS
========================================================= */

function clearGroups() {

  for (
    const group
    of Object.values(
      layerGroups
    )
  ) {

    if (
      map.hasLayer(
        group
      )
    ) {

      map.removeLayer(
        group
      );

    }

  }


  layerGroups =
    {};


  clearInnerClips();

}



/* =========================================================
   RENDER LAYERS
========================================================= */

function renderLayers() {

  clearGroups();


  layersList.innerHTML =
    "";


  if (
    mapLayers.length === 0
  ) {

    layersList.innerHTML =
      `
        <div style="
          color:#68736d;
          font-size:10px;
          padding:10px;
        ">
          Aucune couche disponible.
        </div>
      `;


    return;

  }


  for (
    const layer
    of mapLayers
  ) {


    const group =
      L.layerGroup();


    layerGroups[
      layer.id
    ] =
      group;


    const previousVisible =
      layerVisibility.has(
        layer.id
      )
        ? layerVisibility.get(
            layer.id
          )
        : true;


    if (
      previousVisible
    ) {

      group.addTo(
        map
      );

    }


    const count =
      mapShapes.filter(
        shape =>
          shape.layer_id ===
          layer.id
      ).length;


    const label =
      document.createElement(
        "label"
      );


    label.className =
      "layer-item";


    const checkbox =
      document.createElement(
        "input"
      );


    checkbox.type =
      "checkbox";


    checkbox.checked =
      previousVisible;


    const swatch =
      document.createElement(
        "span"
      );


    swatch.className =
      "layer-swatch";


    swatch.style.background =
      layer.color ||
      "#86ad96";


    swatch.style.color =
      layer.color ||
      "#86ad96";


    const title =
      document.createElement(
        "span"
      );


    title.className =
      "layer-name";


    title.textContent =
      layer.name;


    const countElement =
      document.createElement(
        "span"
      );


    countElement.className =
      "layer-count";


    countElement.textContent =
      count;


    checkbox.addEventListener(
      "change",
      () => {

        layerVisibility.set(
          layer.id,
          checkbox.checked
        );


        if (
          checkbox.checked
        ) {

          group.addTo(
            map
          );


          setTimeout(
            syncAllInnerOutlines,
            30
          );

        }
        else {

          map.removeLayer(
            group
          );

        }

      }
    );


    label.append(
      checkbox,
      swatch,
      title,
      countElement
    );


    layersList.appendChild(
      label
    );

  }

}



/* =========================================================
   POPUP
========================================================= */

function buildPopup(
  shape,
  parentLayer
) {

  const popup =
    document.createElement(
      "div"
    );


  const category =
    document.createElement(
      "div"
    );


  category.className =
    "zone-category";


  category.textContent =
    parentLayer.name;


  popup.appendChild(
    category
  );


  const title =
    document.createElement(
      "h3"
    );


  title.className =
    "zone-title";


  title.textContent =
    shape.name ||
    "Zone";


  popup.appendChild(
    title
  );


  if (
    shape.description
  ) {

    const description =
      document.createElement(
        "p"
      );


    description.className =
      "zone-description";


    description.textContent =
      shape.description;


    popup.appendChild(
      description
    );

  }


  return popup;

}



/* =========================================================
   CONFIGURE SHAPE
========================================================= */

function configureShapeLayer(
  leafletLayer,
  shape,
  parentLayer
) {

  leafletLayer.options.pmIgnore =
    false;


  leafletLayer.bindPopup(

    buildPopup(
      shape,
      parentLayer
    )

  );


  leafletLayer.on(
    "click",
    event => {

      if (
        !editMode
      ) {
        return;
      }


      L.DomEvent.stopPropagation(
        event
      );


      selectExistingShape(
        leafletLayer,
        shape
      );

    }
  );


  const refreshClip =
    () => {

      scheduleInnerOutline(
        leafletLayer
      );

    };


  leafletLayer.on(
    "add",
    refreshClip
  );


  leafletLayer.on(
    "pm:edit",
    refreshClip
  );


  leafletLayer.on(
    "pm:change",
    refreshClip
  );


  leafletLayer.on(
    "pm:markerdrag",
    refreshClip
  );


  leafletLayer.on(
    "pm:vertexadded",
    refreshClip
  );


  leafletLayer.on(
    "pm:vertexremoved",
    refreshClip
  );


  leafletLayer.on(
    "pm:snap",
    refreshClip
  );


  leafletLayer.on(
    "pm:unsnap",
    refreshClip
  );


  scheduleInnerOutline(
    leafletLayer
  );

}



/* =========================================================
   RENDER SHAPES
========================================================= */

function renderShapes() {

  for (
    const shape
    of mapShapes
  ) {


    const parentLayer =
      mapLayers.find(
        layer =>
          layer.id ===
          shape.layer_id
      );


    if (
      !parentLayer ||
      !shape.geometry
    ) {
      continue;
    }


    const color =
      shape.style?.color ||
      parentLayer.color ||
      "#86ad96";


    const opacity =
      shape.style?.opacity ??
      parentLayer.opacity ??
      .30;


    const geometryType =
      shape.geometry.type;


    const polygon =
      geometryType ===
        "Polygon" ||
      geometryType ===
        "MultiPolygon";


    const geo =
      L.geoJSON(

        {

          type:
            "Feature",

          geometry:
            shape.geometry

        },

        {

          style: {

            color:
              color,

            fillColor:
              color,

            fillOpacity:
              polygon
                ? opacity
                : 0,

            /*
              On FORCE 6px pour les zones.
              Le clip en garde environ 3px à l'intérieur.
            */

            weight:
              polygon
                ? 6
                : 3,

            lineCap:
              "round",

            lineJoin:
              "round"

          }

        }

      );


    geo.eachLayer(
      leafletLayer => {

        configureShapeLayer(
          leafletLayer,
          shape,
          parentLayer
        );


        const group =
          layerGroups[
            shape.layer_id
          ];


        if (
          group
        ) {

          leafletLayer.addTo(
            group
          );

        }

      }
    );

  }


  setTimeout(
    syncAllInnerOutlines,
    50
  );

}



/* =========================================================
   UPDATE LAYER SELECT
========================================================= */

function updateShapeLayerSelect() {

  shapeLayerInput.innerHTML =
    "";


  if (
    mapLayers.length === 0
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      "";


    option.textContent =
      "Aucune couche";


    shapeLayerInput.appendChild(
      option
    );


    return;

  }


  for (
    const layer
    of mapLayers
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      layer.id;


    option.textContent =
      layer.name;


    shapeLayerInput.appendChild(
      option
    );

  }

}



/* =========================================================
   NEW SHAPE
========================================================= */

map.on(
  "pm:create",
  event => {

    if (
      !editMode
    ) {

      map.removeLayer(
        event.layer
      );


      return;

    }


    stopDrawing();


    selectedLeafletLayer =
      event.layer;


    temporaryLayer =
      event.layer;


    selectedShapeRecord =
      null;


    selectedLeafletLayer.options.pmIgnore =
      false;


    shapeNameInput.value =
      "";


    shapeDescriptionInput.value =
      "";


    shapePublishedInput.checked =
      true;


    if (
      mapLayers.length > 0
    ) {

      shapeLayerInput.value =
        mapLayers[0].id;


      shapeColorInput.value =
        mapLayers[0].color ||
        "#86ad96";


      shapeOpacityInput.value =
        mapLayers[0].opacity ??
        .30;

    }


    applyShapePreview();


    /*
      Réapplication agressive après pm:create.
      C'est ici que Geoman refaisait parfois le PATH.
    */

    if (
      isAreaLayer(
        selectedLeafletLayer
      )
    ) {

      const refresh =
        () => {

          scheduleInnerOutline(
            selectedLeafletLayer
          );

        };


      selectedLeafletLayer.on(
        "add",
        refresh
      );


      selectedLeafletLayer.on(
        "pm:change",
        refresh
      );


      selectedLeafletLayer.on(
        "pm:edit",
        refresh
      );


      selectedLeafletLayer.on(
        "pm:snap",
        refresh
      );


      refresh();

    }


    status.textContent =
      "Nouvel élément créé. Le contour est conservé à l'intérieur de la zone.";


    updateButtons();

  }
);



/* =========================================================
   SELECT SHAPE
========================================================= */

function selectExistingShape(
  leafletLayer,
  shape
) {

  if (
    selectedLeafletLayer?.pm
  ) {

    selectedLeafletLayer.pm.disable();

  }


  selectedLeafletLayer =
    leafletLayer;


  selectedShapeRecord =
    shape;


  temporaryLayer =
    null;


  shapeLayerInput.value =
    shape.layer_id;


  shapeNameInput.value =
    shape.name ||
    "";


  shapeDescriptionInput.value =
    shape.description ||
    "";


  shapeColorInput.value =
    shape.style?.color ||
    "#86ad96";


  shapeOpacityInput.value =
    shape.style?.opacity ??
    .30;


  shapePublishedInput.checked =
    shape.published ===
    true;


  status.textContent =
    "Sélection : " +
    (
      shape.name ||
      "Sans nom"
    );


  scheduleInnerOutline(
    selectedLeafletLayer
  );


  updateButtons();

}



/* =========================================================
   STYLE PREVIEW
========================================================= */

function applyShapePreview() {

  if (
    !selectedLeafletLayer ||
    typeof
      selectedLeafletLayer.setStyle
      !== "function"
  ) {
    return;
  }


  const geometry =
    selectedLeafletLayer
      .toGeoJSON()
      .geometry;


  const isArea =
    geometry.type ===
      "Polygon" ||
    geometry.type ===
      "MultiPolygon";


  selectedLeafletLayer.setStyle({

    color:
      shapeColorInput.value,

    fillColor:
      shapeColorInput.value,

    fillOpacity:
      isArea
        ? Number(
            shapeOpacityInput.value
          )
        : 0,

    weight:
      isArea
        ? 6
        : 3,

    lineJoin:
      "round",

    lineCap:
      "round"

  });


  if (
    isAreaLayer(
      selectedLeafletLayer
    )
  ) {

    scheduleInnerOutline(
      selectedLeafletLayer
    );

  }

}



shapeColorInput.addEventListener(
  "input",
  applyShapePreview
);


shapeOpacityInput.addEventListener(
  "input",
  applyShapePreview
);



/* =========================================================
   SAVE
========================================================= */

saveShapeButton.addEventListener(
  "click",
  async () => {

    if (
      !selectedLeafletLayer
    ) {
      return;
    }


    if (
      !shapeLayerInput.value
    ) {

      status.textContent =
        "Crée d'abord une couche.";

      return;

    }


    selectedLeafletLayer
      .pm
      ?.disable();


    const geometry =
      selectedLeafletLayer
        .toGeoJSON()
        .geometry;


    const area =
      geometry.type ===
        "Polygon" ||
      geometry.type ===
        "MultiPolygon";


    const payload = {

      layer_id:
        shapeLayerInput.value,

      name:
        shapeNameInput
          .value
          .trim() ||
        "Sans nom",

      description:
        shapeDescriptionInput
          .value
          .trim(),

      geometry:
        geometry,

      style: {

        color:
          shapeColorInput.value,

        opacity:
          Number(
            shapeOpacityInput.value
          ),

        weight:
          area
            ? 6
            : 3

      },

      published:
        shapePublishedInput.checked

    };


    status.textContent =
      "Enregistrement...";


    let response;


    if (
      selectedShapeRecord
    ) {

      response =
        await db
          .from(
            "map_shapes"
          )
          .update(
            payload
          )
          .eq(
            "id",
            selectedShapeRecord.id
          );

    }
    else {

      response =
        await db
          .from(
            "map_shapes"
          )
          .insert(
            payload
          );

    }


    if (
      response.error
    ) {

      console.error(
        response.error
      );


      status.textContent =
        "Erreur : " +
        response.error.message;


      return;

    }


    if (
      temporaryLayer &&
      map.hasLayer(
        temporaryLayer
      )
    ) {

      map.removeLayer(
        temporaryLayer
      );

    }


    selectedLeafletLayer =
      null;


    selectedShapeRecord =
      null;


    temporaryLayer =
      null;


    await loadDatabase();


    updateButtons();


    status.textContent =
      "Élément enregistré.";

  }
);



/* =========================================================
   EDIT VERTICES
========================================================= */

editShapeButton.addEventListener(
  "click",
  () => {

    if (
      !selectedLeafletLayer?.pm
    ) {
      return;
    }


    selectedLeafletLayer.pm.enable({

      snappable:
        true,

      snapDistance:
        30,

      snapVertex:
        true,

      snapSegment:
        true,

      snapMiddle:
        false,

      allowSelfIntersection:
        false

    });


    const refresh =
      () => {

        scheduleInnerOutline(
          selectedLeafletLayer
        );

      };


    selectedLeafletLayer.on(
      "pm:change",
      refresh
    );


    selectedLeafletLayer.on(
      "pm:markerdrag",
      refresh
    );


    selectedLeafletLayer.on(
      "pm:snap",
      refresh
    );


    status.textContent =
      "Modification active. Les points s'accrochent aux sommets et segments existants.";


    updateButtons();

  }
);



finishEditButton.addEventListener(
  "click",
  () => {

    selectedLeafletLayer
      ?.pm
      ?.disable();


    if (
      selectedLeafletLayer
    ) {

      scheduleInnerOutline(
        selectedLeafletLayer
      );

    }


    status.textContent =
      "Modification terminée. Clique sur Enregistrer.";


    updateButtons();

  }
);



/* =========================================================
   CANCEL
========================================================= */

function cancelSelection() {

  if (
    temporaryLayer &&
    map.hasLayer(
      temporaryLayer
    )
  ) {

    map.removeLayer(
      temporaryLayer
    );

  }


  selectedLeafletLayer
    ?.pm
    ?.disable();


  selectedLeafletLayer =
    null;


  selectedShapeRecord =
    null;


  temporaryLayer =
    null;


  shapeNameInput.value =
    "";


  shapeDescriptionInput.value =
    "";


  updateButtons();

}



cancelSelectionButton.addEventListener(
  "click",
  () => {

    cancelSelection();


    status.textContent =
      "Sélection annulée.";

  }
);



/* =========================================================
   DELETE
========================================================= */

deleteShapeButton.addEventListener(
  "click",
  async () => {

    if (
      !selectedShapeRecord
    ) {
      return;
    }


    if (
      !confirm(
        "Supprimer définitivement cet élément ?"
      )
    ) {
      return;
    }


    const {
      error
    } =
      await db
        .from(
          "map_shapes"
        )
        .delete()
        .eq(
          "id",
          selectedShapeRecord.id
        );


    if (
      error
    ) {

      status.textContent =
        "Erreur : " +
        error.message;


      return;

    }


    cancelSelection();


    await loadDatabase();


    status.textContent =
      "Élément supprimé.";

  }
);



/* =========================================================
   CREATE LAYER
========================================================= */

document
  .getElementById(
    "create-layer"
  )
  .addEventListener(
    "click",
    async () => {

      const name =
        document
          .getElementById(
            "new-layer-name"
          )
          .value
          .trim();


      if (
        !name
      ) {

        status.textContent =
          "Entre un nom pour la couche.";

        return;

      }


      const {
        error
      } =
        await db
          .from(
            "map_layers"
          )
          .insert({

            name:

              name,

            kind:

              document
                .getElementById(
                  "new-layer-kind"
                )
                .value,

            color:

              document
                .getElementById(
                  "new-layer-color"
                )
                .value,

            opacity:

              Number(
                document
                  .getElementById(
                    "new-layer-opacity"
                  )
                  .value
              ),

            visible:

              true

          });


      if (
        error
      ) {

        status.textContent =
          "Erreur : " +
          error.message;


        return;

      }


      document
        .getElementById(
          "new-layer-name"
        )
        .value =
          "";


      await loadDatabase();


      status.textContent =
        "Couche créée.";

    }
  );



/* =========================================================
   BUTTON STATES
========================================================= */

function updateButtons() {

  saveShapeButton.disabled =
    !selectedLeafletLayer;


  editShapeButton.disabled =
    !selectedShapeRecord;


  finishEditButton.disabled =
    !(
      selectedLeafletLayer &&
      selectedLeafletLayer.pm &&
      selectedLeafletLayer.pm.enabled()
    );


  cancelSelectionButton.disabled =
    !selectedLeafletLayer;


  deleteShapeButton.disabled =
    !selectedShapeRecord;

}



/* =========================================================
   START
========================================================= */

await refreshAuth();


await loadDatabase();


updateButtons();


setTimeout(
  () => {

    map.invalidateSize();


    syncAllInnerOutlines();

  },
  300
);


})();

</script>
