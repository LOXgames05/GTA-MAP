<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA MAP</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -5,
    maxZoom: 3,
    attributionControl: false
});


// Ta map fait 6000 × 8000

const bounds = [
    [0, 0],
    [8000, 6000]
];


// Ton image

const carte = L.imageOverlay(
    "images/map.png",
    bounds
).addTo(map);


// Affichage initial

map.fitBounds(bounds);


// Limites

map.setMaxBounds(bounds);

</script>

</body>
</html>
