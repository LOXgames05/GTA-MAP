<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GTA MAP</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #111;
    }

    /* =========================
       PANNEAU DES COUCHES
    ========================= */

    #layers-panel {
      position: absolute;

      top: 20px;
      right: 20px;

      z-index: 1000;

      width: 260px;
      max-height: calc(100vh - 40px);

      overflow-y: auto;

      padding: 15px;

      background: rgba(13, 17, 23, 0.94);

      border:
        1px solid #30363d;

      border-radius: 10px;

      color: white;

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.45);
    }

    #layers-panel h2 {
      margin:
        0 0 12px;

      font-size: 17px;
    }

    #layers-list {
      display: grid;
      gap: 8px;
    }

    .layer-item {
      display: flex;

      align-items: center;

      gap: 9px;

      padding: 8px;

      background: #161b22;

      border:
        1px solid #30363d;

      border-radius: 6px;

      cursor: pointer;
    }

    .layer-item:hover {
      background: #21262d;
    }

    .layer-item input {
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    .layer-color {
      width: 14px;
      height: 14px;

      flex-shrink: 0;

      border-radius: 3px;

      border:
        1px solid rgba(255,255,255,0.4);
    }

    .layer-name {
      flex: 1;

      font-size: 14px;
      font-weight: bold;
    }

    .layer-count {
      color: #8b949e;

      font-size: 12px;
    }

    #status {
      margin-top: 12px;

      padding-top: 10px;

      border-top:
        1px solid #30363d;

      color: #8b949e;

      font-size: 12px;
    }


    /* =========================
       POPUPS
    ========================= */

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #161b22;
      color: white;
    }

    .zone-popup h3 {
      margin:
        0 0 6px;

      font-size: 16px;
    }

    .zone-popup p {
      margin: 0;

      color: #b1bac4;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      #layers-panel {
        top: 10px;
        right: 10px;

        width: 210px;

        max-height: 45vh;
      }

    }

  </style>

</head>


<body>


  <div id="map"></div>


  <div id="layers-panel">

    <h2>
      Couches
    </h2>

    <div id="layers-list">

      Chargement...

    </div>

    <div id="status">

      Connexion à la carte...

    </div>

  </div>



  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- CONFIG -->

  <script src="js/config.js"></script>


  <!-- CLIENT SUPABASE -->

  <script src="js/supabase-client.js"></script>



<script>

(async function () {


  const status =
    document.getElementById(
      "status"
    );


  const layersList =
    document.getElementById(
      "layers-list"
    );


  const MAP_IMAGE =
    "https://loxgames05.github.io/GTA-MAP/images/map.png?v=20";


  let map;


  const leafletGroups =
    {};


  /* =========================
     IMAGE SIZE
  ========================= */


  function loadImageSize(src) {

    return new Promise(
      (resolve, reject) => {

        const image =
          new Image();


        image.onload =
          () => {

            resolve({
              width:
                image.naturalWidth,

              height:
                image.naturalHeight
            });

          };


        image.onerror =
          () => {

            reject(
              new Error(
                "Impossible de charger la carte."
              )
            );

          };


        image.src =
          src;

      }
    );

  }



  /* =========================
     INITIALISATION MAP
  ========================= */


  try {


    status.textContent =
      "Chargement de l'image...";


    const size =
      await loadImageSize(
        MAP_IMAGE
      );


    const bounds =
      [

        [0, 0],

        [
          size.height,
          size.width
        ]

      ];


    map =
      L.map(
        "map",
        {

          crs:
            L.CRS.Simple,

          minZoom:
            -6,

          maxZoom:
            5,

          zoomSnap:
            0.25,

          attributionControl:
            false

        }
      );


    L.imageOverlay(
      MAP_IMAGE,
      bounds
    ).addTo(map);


    map.fitBounds(
      bounds
    );


    map.setMaxBounds(
      [

        [
          -size.height,
          -size.width
        ],

        [
          size.height * 2,
          size.width * 2
        ]

      ]
    );


  }
  catch (error) {


    console.error(error);


    status.textContent =
      "Erreur carte : " +
      error.message;


    return;

  }



  /* =========================
     CHARGER LES COUCHES
  ========================= */


  status.textContent =
    "Chargement des couches...";


  const {
    data: mapLayers,
    error: layersError
  } =
    await db
      .from("map_layers")
      .select("*")
      .eq(
        "visible",
        true
      )
      .order(
        "sort_order"
      )
      .order(
        "name"
      );


  if (layersError) {


    console.error(
      layersError
    );


    status.textContent =
      "Erreur couches : " +
      layersError.message;


    return;

  }



  /* =========================
     CHARGER LES FORMES
  ========================= */


  const {
    data: mapShapes,
    error: shapesError
  } =
    await db
      .from("map_shapes")
      .select("*")
      .eq(
        "published",
        true
      )
      .order(
        "created_at"
      );


  if (shapesError) {


    console.error(
      shapesError
    );


    status.textContent =
      "Erreur zones : " +
      shapesError.message;


    return;

  }



  /* =========================
     CRÉER LES GROUPES
  ========================= */


  layersList.innerHTML =
    "";


  if (
    !mapLayers ||
    mapLayers.length === 0
  ) {


    layersList.innerHTML =
      "<div>Aucune couche publique.</div>";


    status.textContent =
      "0 couche";


    return;

  }



  for (
    const layer
    of mapLayers
  ) {


    const group =
      L.layerGroup();


    leafletGroups[
      layer.id
    ] =
      group;


    /*
      La couche est activée
      par défaut.
    */

    group.addTo(
      map
    );



    /* =========================
       FORMES DE CETTE COUCHE
    ========================= */


    const shapes =
      (
        mapShapes || []
      ).filter(
        shape =>
          shape.layer_id ===
          layer.id
      );



    for (
      const shape
      of shapes
    ) {


      if (
        !shape.geometry
      ) {
        continue;
      }



      const color =
        shape.style?.color ||
        layer.color ||
        "#8a3ffc";


      const opacity =
        shape.style?.opacity ??
        layer.opacity ??
        0.35;


      const weight =
        shape.style?.weight ??
        3;



      const geo =
        L.geoJSON(
          {

            type:
              "Feature",

            geometry:
              shape.geometry,

            properties:
              {}

          },
          {

            style:
              {

                color:
                  color,

                fillColor:
                  color,

                fillOpacity:
                  opacity,

                weight:
                  weight

              }

          }
        );



      /* =========================
         POPUP
      ========================= */


      const popup =
        document.createElement(
          "div"
        );


      popup.className =
        "zone-popup";


      const title =
        document.createElement(
          "h3"
        );


      title.textContent =
        shape.name ||
        "Zone";


      popup.appendChild(
        title
      );



      if (
        shape.description
      ) {


        const description =
          document.createElement(
            "p"
          );


        description.textContent =
          shape.description;


        popup.appendChild(
          description
        );


      }



      geo.bindPopup(
        popup
      );


      geo.addTo(
        group
      );


    }



    /* =========================
       CHECKBOX
    ========================= */


    const label =
      document.createElement(
        "label"
      );


    label.className =
      "layer-item";



    const checkbox =
      document.createElement(
        "input"
      );


    checkbox.type =
      "checkbox";


    checkbox.checked =
      true;



    const colorBox =
      document.createElement(
        "span"
      );


    colorBox.className =
      "layer-color";


    colorBox.style.background =
      layer.color ||
      "#8a3ffc";



    const name =
      document.createElement(
        "span"
      );


    name.className =
      "layer-name";


    name.textContent =
      layer.name;



    const count =
      document.createElement(
        "span"
      );


    count.className =
      "layer-count";


    count.textContent =
      shapes.length;



    checkbox.addEventListener(
      "change",
      () => {


        if (
          checkbox.checked
        ) {


          if (
            !map.hasLayer(
              group
            )
          ) {


            group.addTo(
              map
            );


          }


        }
        else {


          if (
            map.hasLayer(
              group
            )
          ) {


            map.removeLayer(
              group
            );


          }


        }


      }
    );



    label.appendChild(
      checkbox
    );


    label.appendChild(
      colorBox
    );


    label.appendChild(
      name
    );


    label.appendChild(
      count
    );


    layersList.appendChild(
      label
    );


  }



  /* =========================
     STATUS
  ========================= */


  const numberOfShapes =
    (
      mapShapes ||
      []
    ).length;


  status.textContent =
    mapLayers.length +
    " couche(s) • " +
    numberOfShapes +
    " zone(s)";



  setTimeout(
    () => {

      map.invalidateSize();

    },
    300
  );


})();

</script>


</body>

</html>
