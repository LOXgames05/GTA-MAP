<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA MAP</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#map {
    width: 100vw;
    height: 100vh;
    background: #111;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const largeur = 6000;
const hauteur = 8000;

const bounds = [
    [0, 0],
    [hauteur, largeur]
];

const map = L.map("map", {

    crs: L.CRS.Simple,

    minZoom: -5,
    maxZoom: 3,

    zoomSnap: 0.25,

    attributionControl: false

});


// IMAGE PRINCIPALE

const carte = L.imageOverlay(

    "https://raw.githubusercontent.com/LOXgames05/GTA-MAP/main/images/map.png",

    bounds

).addTo(map);


// Centrer automatiquement

map.fitBounds(bounds);


// Empêcher de partir trop loin

map.setMaxBounds([
    [-1000, -1000],
    [hauteur + 1000, largeur + 1000]
]);

</script>

</body>

</html>
