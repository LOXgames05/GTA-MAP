<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GTA MAP</title>


<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<!-- Leaflet Geoman -->
<link
  rel="stylesheet"
  href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css"
>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

:root {

  --bg:
    #090d12;

  --panel:
    rgba(17, 22, 29, .96);

  --panel-soft:
    rgba(22, 28, 36, .92);

  --border:
    rgba(255,255,255,.10);

  --border-strong:
    rgba(255,255,255,.18);

  --text:
    #f4f7fb;

  --muted:
    #8f9baa;

  --purple:
    #8b5cf6;

  --purple-hover:
    #9f7aea;

  --green:
    #238636;

  --green-hover:
    #2ea043;

  --red:
    #da3633;

  --red-hover:
    #f85149;

  --yellow:
    #f0c74b;

  --shadow:
    0 14px 45px rgba(0,0,0,.45);

}


html,
body {

  width: 100%;
  height: 100%;

  margin: 0;

  overflow: hidden;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   MAP
========================================================= */

#map {

  position: absolute;

  inset: 0;

  background:
    #0a0d11;

  z-index: 1;

}


.leaflet-container {

  background:
    #0a0d11;

}


/* Zoom Leaflet */

.leaflet-control-zoom {

  border:
    1px solid var(--border) !important;

  border-radius:
    12px !important;

  overflow:
    hidden;

  box-shadow:
    var(--shadow) !important;

}


.leaflet-control-zoom a {

  background:
    rgba(17,22,29,.96) !important;

  color:
    white !important;

  border:
    0 !important;

}


.leaflet-control-zoom a:hover {

  background:
    #252d38 !important;

}



/* =========================================================
   TOP BAR
========================================================= */

#topbar {

  position: fixed;

  top: 14px;
  left: 14px;
  right: 14px;

  z-index: 5000;

  min-height: 58px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 14px;

  padding:
    9px 10px 9px 18px;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  background:
    rgba(12, 16, 22, .92);

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.35);

}


.brand {

  display: flex;

  align-items: center;

  gap: 12px;

  min-width: 0;

}


.brand-logo {

  width: 36px;
  height: 36px;

  display: grid;

  place-items: center;

  flex:
    0 0 auto;

  border-radius:
    10px;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #5b21b6
    );

  box-shadow:
    0 6px 22px rgba(139,92,246,.35);

  font-size:
    18px;

  font-weight:
    900;

}


.brand-text {

  min-width: 0;

}


.brand-title {

  margin: 0;

  font-size:
    17px;

  font-weight:
    800;

  letter-spacing:
    .3px;

}


.brand-subtitle {

  margin-top:
    2px;

  color:
    var(--muted);

  font-size:
    11px;

}


#top-actions {

  display: flex;

  align-items: center;

  gap: 7px;

  flex-wrap:
    wrap;

  justify-content:
    flex-end;

}


#admin-email {

  max-width:
    220px;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;

  margin-right:
    5px;

  color:
    var(--muted);

  font-size:
    12px;

}



/* =========================================================
   BUTTONS
========================================================= */

button {

  appearance:
    none;

  border:
    1px solid var(--border);

  outline:
    0;

  min-height:
    38px;

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    7px;

  padding:
    8px 12px;

  border-radius:
    10px;

  background:
    #1b222c;

  color:
    white;

  font-family:
    inherit;

  font-size:
    12px;

  font-weight:
    700;

  cursor:
    pointer;

  transition:
    transform .12s ease,
    background .12s ease,
    border-color .12s ease,
    box-shadow .12s ease;

}


button:hover {

  background:
    #252e3a;

  border-color:
    var(--border-strong);

}


button:active {

  transform:
    scale(.97);

}


button.primary {

  background:
    var(--purple);

  border-color:
    transparent;

  box-shadow:
    0 5px 18px rgba(139,92,246,.25);

}


button.primary:hover {

  background:
    var(--purple-hover);

}


button.green {

  background:
    var(--green);

  border-color:
    transparent;

}


button.green:hover {

  background:
    var(--green-hover);

}


button.red {

  background:
    rgba(218,54,51,.18);

  color:
    #ff8582;

  border-color:
    rgba(218,54,51,.35);

}


button.red:hover {

  background:
    var(--red);

  color:
    white;

}


button.ghost {

  background:
    transparent;

}


button.active {

  background:
    var(--purple);

  border-color:
    transparent;

}


button:disabled {

  opacity:
    .35;

  cursor:
    not-allowed;

  transform:
    none;

}



/* =========================================================
   LAYER PANEL
========================================================= */

#layers-panel {

  position: fixed;

  top: 88px;

  right: 14px;

  z-index: 3000;

  width:
    290px;

  max-height:
    calc(100vh - 105px);

  overflow:
    hidden;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  background:
    var(--panel);

  backdrop-filter:
    blur(18px);

  box-shadow:
    var(--shadow);

  transition:
    transform .2s ease,
    opacity .2s ease;

}


#layers-panel.hidden {

  transform:
    translateX(calc(100% + 30px));

  opacity:
    0;

  pointer-events:
    none;

}


.panel-header {

  height:
    54px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    0 13px 0 16px;

  border-bottom:
    1px solid var(--border);

}


.panel-title {

  font-size:
    14px;

  font-weight:
    800;

}


.panel-content {

  max-height:
    calc(100vh - 160px);

  overflow-y:
    auto;

  padding:
    12px;

}


#layers-list {

  display:
    grid;

  gap:
    8px;

}


.layer-item {

  display:
    grid;

  grid-template-columns:
    20px 16px 1fr auto;

  align-items:
    center;

  gap:
    8px;

  min-height:
    44px;

  padding:
    7px 9px;

  border:
    1px solid transparent;

  border-radius:
    10px;

  background:
    rgba(255,255,255,.035);

  cursor:
    pointer;

  transition:
    .15s ease;

}


.layer-item:hover {

  background:
    rgba(255,255,255,.07);

  border-color:
    var(--border);

}


.layer-item input {

  width:
    16px;

  height:
    16px;

  accent-color:
    var(--purple);

}


.layer-color {

  width:
    13px;

  height:
    13px;

  border-radius:
    4px;

  border:
    1px solid rgba(255,255,255,.4);

}


.layer-title {

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;

  font-size:
    12px;

  font-weight:
    700;

}


.layer-count {

  min-width:
    22px;

  padding:
    3px 6px;

  border-radius:
    999px;

  background:
    rgba(255,255,255,.06);

  color:
    var(--muted);

  text-align:
    center;

  font-size:
    10px;

}



/* =========================================================
   EDITOR PANEL
========================================================= */

#editor-panel {

  position: fixed;

  top:
    88px;

  left:
    14px;

  z-index:
    3200;

  width:
    330px;

  max-height:
    calc(100vh - 105px);

  overflow:
    hidden;

  display:
    none;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  background:
    var(--panel);

  backdrop-filter:
    blur(18px);

  box-shadow:
    var(--shadow);

}


#editor-panel.visible {

  display:
    block;

}


.editor-scroll {

  max-height:
    calc(100vh - 160px);

  overflow-y:
    auto;

  padding:
    14px;

}


.section {

  padding:
    0 0 17px;

  margin:
    0 0 17px;

  border-bottom:
    1px solid var(--border);

}


.section:last-child {

  border-bottom:
    0;

  margin-bottom:
    0;

}


.section-title {

  margin:
    0 0 12px;

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  font-size:
    13px;

  font-weight:
    800;

}


label {

  display:
    block;

  margin:
    11px 0 5px;

  color:
    #c8d1dc;

  font-size:
    11px;

  font-weight:
    700;

}


input,
select,
textarea {

  width:
    100%;

  min-height:
    40px;

  border:
    1px solid var(--border);

  outline:
    none;

  padding:
    9px 10px;

  border-radius:
    9px;

  background:
    #0c1117;

  color:
    white;

  font-family:
    inherit;

  transition:
    border-color .15s ease;

}


input:focus,
select:focus,
textarea:focus {

  border-color:
    var(--purple);

}


textarea {

  min-height:
    76px;

  resize:
    vertical;

}


input[type="color"] {

  padding:
    4px;

  cursor:
    pointer;

}


input[type="range"] {

  min-height:
    30px;

  padding:
    0;

  accent-color:
    var(--purple);

}


.two-columns {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

}


.checkbox-line {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  margin-top:
    12px;

}


.checkbox-line input {

  width:
    16px;

  min-height:
    16px;

  accent-color:
    var(--purple);

}


.button-list {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    7px;

  margin-top:
    13px;

}


.button-list .full {

  grid-column:
    1 / -1;

}



/* =========================================================
   STATUS
========================================================= */

#status {

  padding:
    10px 11px;

  border:
    1px solid rgba(240,199,75,.20);

  border-radius:
    10px;

  background:
    rgba(240,199,75,.06);

  color:
    var(--yellow);

  font-size:
    11px;

  line-height:
    1.4;

}



/* =========================================================
   CUSTOM DRAW TOOLBAR
========================================================= */

#draw-toolbar {

  position:
    fixed;

  left:
    50%;

  bottom:
    18px;

  z-index:
    4500;

  transform:
    translateX(-50%);

  display:
    none;

  align-items:
    center;

  gap:
    6px;

  padding:
    7px;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  background:
    rgba(12,16,22,.94);

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 14px 45px rgba(0,0,0,.5);

}


#draw-toolbar.visible {

  display:
    flex;

}


.tool-button {

  position:
    relative;

  min-width:
    48px;

  height:
    46px;

  padding:
    0 13px;

  border-radius:
    11px;

  flex-direction:
    column;

  gap:
    2px;

  font-size:
    9px;

}


.tool-icon {

  font-size:
    17px;

  line-height:
    18px;

}


.tool-divider {

  width:
    1px;

  height:
    32px;

  margin:
    0 3px;

  background:
    var(--border);

}



/* =========================================================
   LOGIN
========================================================= */

#login-overlay {

  position:
    fixed;

  inset:
    0;

  z-index:
    9000;

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

  background:
    rgba(2,4,8,.76);

  backdrop-filter:
    blur(12px);

}


#login-overlay.visible {

  display:
    flex;

}


#login-box {

  width:
    390px;

  max-width:
    100%;

  padding:
    24px;

  border:
    1px solid var(--border);

  border-radius:
    18px;

  background:
    #11171f;

  box-shadow:
    0 30px 100px rgba(0,0,0,.65);

}


#login-box h2 {

  margin:
    0 0 6px;

  font-size:
    20px;

}


.login-subtitle {

  margin:
    0 0 18px;

  color:
    var(--muted);

  font-size:
    12px;

}


#login-error {

  margin-top:
    12px;

  color:
    var(--yellow);

  font-size:
    12px;

}



/* =========================================================
   POPUP
========================================================= */

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

  background:
    #11171f;

  color:
    white;

}


.popup-title {

  margin:
    0 0 5px;

}


.popup-description {

  margin:
    0;

  color:
    var(--muted);

}



/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 850px) {

  #topbar {

    left:
      8px;

    right:
      8px;

    top:
      8px;

  }


  .brand-subtitle,
  #admin-email {

    display:
      none;

  }


  #top-actions button {

    padding:
      7px 9px;

    font-size:
      10px;

  }


  #layers-panel {

    top:
      78px;

    right:
      8px;

    width:
      235px;

  }


  #editor-panel {

    top:
      auto;

    left:
      8px;

    right:
      8px;

    bottom:
      82px;

    width:
      auto;

    max-height:
      52vh;

  }


  .editor-scroll {

    max-height:
      calc(52vh - 55px);

  }


  #draw-toolbar {

    bottom:
      10px;

    max-width:
      calc(100vw - 16px);

    overflow-x:
      auto;

  }


  .tool-button {

    flex:
      0 0 auto;

  }

}

</style>

</head>


<body>


<!-- ======================================================
     MAP
====================================================== -->

<div id="map"></div>



<!-- ======================================================
     TOP BAR
====================================================== -->

<header id="topbar">

  <div class="brand">

    <div class="brand-logo">
      G
    </div>

    <div class="brand-text">

      <div class="brand-title">
        GTA MAP
      </div>

      <div class="brand-subtitle">
        Carte interactive
      </div>

    </div>

  </div>


  <div id="top-actions">

    <span id="admin-email"></span>


    <button id="toggle-layers">
      ☰ Couches
    </button>


    <button id="login-button">
      🔐 Admin
    </button>


    <button
      id="edit-mode-button"
      class="primary"
      style="display:none;"
    >
      ✏ Éditer
    </button>


    <button
      id="logout-button"
      class="red"
      style="display:none;"
    >
      ↪ Quitter
    </button>

  </div>

</header>



<!-- ======================================================
     LAYERS PANEL
====================================================== -->

<aside id="layers-panel">

  <div class="panel-header">

    <span class="panel-title">
      Couches
    </span>

    <button
      id="close-layers"
      class="ghost"
    >
      ✕
    </button>

  </div>


  <div class="panel-content">

    <div id="layers-list">
      Chargement...
    </div>

  </div>

</aside>



<!-- ======================================================
     EDITOR PANEL
====================================================== -->

<aside id="editor-panel">

  <div class="panel-header">

    <span class="panel-title">
      Éditeur
    </span>

    <button
      id="close-editor"
      class="ghost"
    >
      ✕
    </button>

  </div>


  <div class="editor-scroll">


    <section class="section">

      <div class="section-title">
        ◉ État
      </div>

      <div id="status">
        Initialisation...
      </div>

    </section>



    <section class="section">

      <div class="section-title">
        ◇ Élément sélectionné
      </div>


      <label>
        Couche
      </label>

      <select id="shape-layer"></select>


      <label>
        Nom
      </label>

      <input
        id="shape-name"
        type="text"
        placeholder="Ex. Vinewood Hills"
      >


      <label>
        Description
      </label>

      <textarea
        id="shape-description"
        placeholder="Description optionnelle"
      ></textarea>


      <div class="two-columns">

        <div>

          <label>
            Couleur
          </label>

          <input
            id="shape-color"
            type="color"
            value="#8b5cf6"
          >

        </div>


        <div>

          <label>
            Opacité
          </label>

          <input
            id="shape-opacity"
            type="range"
            min="0"
            max=".85"
            step=".05"
            value=".35"
          >

        </div>

      </div>


      <label class="checkbox-line">

        <input
          id="shape-published"
          type="checkbox"
          checked
        >

        Visible publiquement

      </label>


      <div class="button-list">

        <button
          id="save-shape"
          class="green full"
          disabled
        >
          ✓ Enregistrer
        </button>


        <button
          id="edit-shape"
          disabled
        >
          ✦ Sommets
        </button>


        <button
          id="finish-edit"
          disabled
        >
          ✓ Terminer
        </button>


        <button
          id="cancel-selection"
          disabled
        >
          ↶ Annuler
        </button>


        <button
          id="delete-shape"
          class="red"
          disabled
        >
          🗑 Supprimer
        </button>

      </div>

    </section>



    <section class="section">

      <div class="section-title">
        ＋ Nouvelle couche
      </div>


      <label>
        Nom
      </label>

      <input
        id="new-layer-name"
        placeholder="Ex. Quartiers"
      >


      <label>
        Type
      </label>

      <select id="new-layer-kind">

        <option value="quartier">
          Quartiers
        </option>

        <option value="faction">
          Factions
        </option>

        <option value="frontiere">
          Frontières
        </option>

        <option value="autre">
          Autre
        </option>

      </select>


      <div class="two-columns">

        <div>

          <label>
            Couleur
          </label>

          <input
            id="new-layer-color"
            type="color"
            value="#8b5cf6"
          >

        </div>


        <div>

          <label>
            Opacité
          </label>

          <input
            id="new-layer-opacity"
            type="range"
            min="0"
            max=".85"
            step=".05"
            value=".35"
          >

        </div>

      </div>


      <div class="button-list">

        <button
          id="create-layer"
          class="primary full"
        >
          ＋ Créer la couche
        </button>

      </div>

    </section>

  </div>

</aside>



<!-- ======================================================
     CUSTOM DRAW TOOLBAR
====================================================== -->

<div id="draw-toolbar">


  <button
    id="draw-polygon"
    class="tool-button"
  >

    <span class="tool-icon">
      ⬡
    </span>

    Polygone

  </button>


  <button
    id="draw-rectangle"
    class="tool-button"
  >

    <span class="tool-icon">
      ▭
    </span>

    Rectangle

  </button>


  <button
    id="draw-line"
    class="tool-button"
  >

    <span class="tool-icon">
      ╱
    </span>

    Frontière

  </button>


  <div class="tool-divider"></div>


  <button
    id="stop-drawing"
    class="tool-button red"
  >

    <span class="tool-icon">
      ✕
    </span>

    Annuler

  </button>

</div>



<!-- ======================================================
     LOGIN
====================================================== -->

<div id="login-overlay">

  <div id="login-box">

    <h2>
      Connexion administrateur
    </h2>

    <p class="login-subtitle">
      Accès aux outils d'édition de la carte.
    </p>


    <form id="login-form">

      <label>
        Email
      </label>

      <input
        id="login-email"
        type="email"
        required
      >


      <label>
        Mot de passe
      </label>

      <input
        id="login-password"
        type="password"
        required
      >


      <div class="button-list">

        <button
          type="submit"
          class="primary full"
        >
          Se connecter
        </button>


        <button
          id="close-login"
          type="button"
          class="full"
        >
          Annuler
        </button>

      </div>


      <div id="login-error"></div>

    </form>

  </div>

</div>



<!-- ======================================================
     LIBRARIES
====================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script
  src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.js"
></script>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="js/config.js"></script>

<script src="js/supabase-client.js"></script>



<script>

(async function () {


/* =========================================================
   ELEMENTS
========================================================= */

const layersPanel =
  document.getElementById(
    "layers-panel"
  );


const editorPanel =
  document.getElementById(
    "editor-panel"
  );


const drawToolbar =
  document.getElementById(
    "draw-toolbar"
  );


const layersList =
  document.getElementById(
    "layers-list"
  );


const status =
  document.getElementById(
    "status"
  );


const loginButton =
  document.getElementById(
    "login-button"
  );


const editModeButton =
  document.getElementById(
    "edit-mode-button"
  );


const logoutButton =
  document.getElementById(
    "logout-button"
  );


const adminEmail =
  document.getElementById(
    "admin-email"
  );


const loginOverlay =
  document.getElementById(
    "login-overlay"
  );


const loginForm =
  document.getElementById(
    "login-form"
  );


const loginError =
  document.getElementById(
    "login-error"
  );


const shapeLayerInput =
  document.getElementById(
    "shape-layer"
  );


const shapeNameInput =
  document.getElementById(
    "shape-name"
  );


const shapeDescriptionInput =
  document.getElementById(
    "shape-description"
  );


const shapeColorInput =
  document.getElementById(
    "shape-color"
  );


const shapeOpacityInput =
  document.getElementById(
    "shape-opacity"
  );


const shapePublishedInput =
  document.getElementById(
    "shape-published"
  );


const saveShapeButton =
  document.getElementById(
    "save-shape"
  );


const editShapeButton =
  document.getElementById(
    "edit-shape"
  );


const finishEditButton =
  document.getElementById(
    "finish-edit"
  );


const cancelSelectionButton =
  document.getElementById(
    "cancel-selection"
  );


const deleteShapeButton =
  document.getElementById(
    "delete-shape"
  );



/* =========================================================
   STATE
========================================================= */

let map =
  null;


let currentUser =
  null;


let admin =
  false;


let editMode =
  false;


let mapLayers =
  [];


let mapShapes =
  [];


let layerGroups =
  {};


let renderedShapeLayers =
  [];


let selectedLeafletLayer =
  null;


let selectedShapeRecord =
  null;


let temporaryLayer =
  null;



/* =========================================================
   MAP IMAGE
========================================================= */

const MAP_IMAGE =
  window.APP_CONFIG.MAP_IMAGE;


function loadImageSize(src) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () => {

          resolve({

            width:
              image.naturalWidth,

            height:
              image.naturalHeight

          });

        };


      image.onerror =
        () => {

          reject(
            new Error(
              "Impossible de charger la carte."
            )
          );

        };


      image.src =
        src + "?v=60";

    }
  );

}



/* =========================================================
   MAP
========================================================= */

const imageSize =
  await loadImageSize(
    MAP_IMAGE
  );


const bounds =
  [

    [0,0],

    [
      imageSize.height,
      imageSize.width
    ]

  ];


map =
  L.map(
    "map",
    {

      crs:
        L.CRS.Simple,

      minZoom:
        -6,

      maxZoom:
        5,

      zoomSnap:
        .25,

      attributionControl:
        false,

      zoomControl:
        false

    }
  );


L.control
  .zoom({

    position:
      "bottomright"

  })
  .addTo(
    map
  );


L.imageOverlay(

  MAP_IMAGE + "?v=60",

  bounds,

  {

    interactive:
      false,

    pmIgnore:
      true

  }

).addTo(
  map
);


map.fitBounds(
  bounds
);


map.setMaxBounds(
  [

    [
      -imageSize.height,
      -imageSize.width
    ],

    [
      imageSize.height * 2,
      imageSize.width * 2
    ]

  ]
);



/* =========================================================
   SNAP CONFIG
========================================================= */

map.pm.setGlobalOptions({

  snappable:
    true,

  snapDistance:
    30,

  snapVertex:
    true,

  snapSegment:
    true,

  snapMiddle:
    false,

  allowSelfIntersection:
    false

});



/* =========================================================
   UI PANELS
========================================================= */

document
  .getElementById(
    "toggle-layers"
  )
  .addEventListener(
    "click",
    () => {

      layersPanel.classList.toggle(
        "hidden"
      );

    }
  );


document
  .getElementById(
    "close-layers"
  )
  .addEventListener(
    "click",
    () => {

      layersPanel.classList.add(
        "hidden"
      );

    }
  );


document
  .getElementById(
    "close-editor"
  )
  .addEventListener(
    "click",
    () => {

      editorPanel.classList.remove(
        "visible"
      );

    }
  );



/* =========================================================
   AUTH
========================================================= */

async function refreshAuth() {

  const {
    data:
    {
      user
    }
  } =
    await db.auth.getUser();


  currentUser =
    user || null;


  admin =
    false;


  if (
    currentUser
  ) {

    const {
      data: isAdmin
    } =
      await db.rpc(
        "is_admin"
      );


    admin =
      isAdmin === true;

  }


  if (
    admin
  ) {

    loginButton.style.display =
      "none";


    editModeButton.style.display =
      "";


    logoutButton.style.display =
      "";


    adminEmail.textContent =
      currentUser.email || "";

  }
  else {

    loginButton.style.display =
      "";


    editModeButton.style.display =
      "none";


    logoutButton.style.display =
      "none";


    adminEmail.textContent =
      "";


    if (
      editMode
    ) {

      disableEditMode();

    }

  }

}



/* =========================================================
   LOGIN
========================================================= */

loginButton.addEventListener(
  "click",
  () => {

    loginError.textContent =
      "";


    loginOverlay.classList.add(
      "visible"
    );

  }
);


document
  .getElementById(
    "close-login"
  )
  .addEventListener(
    "click",
    () => {

      loginOverlay.classList.remove(
        "visible"
      );

    }
  );


loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    loginError.textContent =
      "Connexion...";


    const email =
      document
        .getElementById(
          "login-email"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "login-password"
        )
        .value;


    const {
      error
    } =
      await db.auth
        .signInWithPassword({

          email,
          password

        });


    if (
      error
    ) {

      loginError.textContent =
        error.message;

      return;

    }


    await refreshAuth();


    if (
      !admin
    ) {

      await db.auth.signOut();


      loginError.textContent =
        "Ce compte n'est pas administrateur.";


      await refreshAuth();


      return;

    }


    loginOverlay.classList.remove(
      "visible"
    );


    await loadDatabase();

  }
);


logoutButton.addEventListener(
  "click",
  async () => {

    await db.auth.signOut();


    await refreshAuth();


    await loadDatabase();

  }
);



/* =========================================================
   EDIT MODE
========================================================= */

function enableEditMode() {

  if (
    !admin
  ) {
    return;
  }


  editMode =
    true;


  editModeButton.classList.add(
    "active"
  );


  editModeButton.textContent =
    "✓ Édition active";


  editorPanel.classList.add(
    "visible"
  );


  drawToolbar.classList.add(
    "visible"
  );


  layersPanel.classList.remove(
    "hidden"
  );


  status.textContent =
    "Mode édition actif. Accrochage automatique activé.";


  loadDatabase();

}


function disableEditMode() {

  editMode =
    false;


  stopDrawing();


  editModeButton.classList.remove(
    "active"
  );


  editModeButton.textContent =
    "✏ Éditer";


  editorPanel.classList.remove(
    "visible"
  );


  drawToolbar.classList.remove(
    "visible"
  );


  cancelSelection();


  loadDatabase();

}


editModeButton.addEventListener(
  "click",
  () => {

    if (
      editMode
    ) {

      disableEditMode();

    }
    else {

      enableEditMode();

    }

  }
);



/* =========================================================
   CUSTOM DRAW BUTTONS
========================================================= */

function clearToolActive() {

  document
    .querySelectorAll(
      ".tool-button"
    )
    .forEach(
      button => {

        button.classList.remove(
          "active"
        );

      }
    );

}


function stopDrawing() {

  map.pm.disableDraw();


  clearToolActive();

}


function startDraw(
  type,
  button
) {

  if (
    !editMode
  ) {
    return;
  }


  stopDrawing();


  button.classList.add(
    "active"
  );


  map.pm.enableDraw(

    type,

    {

      snappable:
        true,

      snapDistance:
        30,

      snapVertex:
        true,

      snapSegment:
        true,

      allowSelfIntersection:
        false

    }

  );

}


document
  .getElementById(
    "draw-polygon"
  )
  .addEventListener(
    "click",
    event => {

      startDraw(
        "Polygon",
        event.currentTarget
      );

    }
  );


document
  .getElementById(
    "draw-rectangle"
  )
  .addEventListener(
    "click",
    event => {

      startDraw(
        "Rectangle",
        event.currentTarget
      );

    }
  );


document
  .getElementById(
    "draw-line"
  )
  .addEventListener(
    "click",
    event => {

      startDraw(
        "Line",
        event.currentTarget
      );

    }
  );


document
  .getElementById(
    "stop-drawing"
  )
  .addEventListener(
    "click",
    stopDrawing
  );


map.on(
  "pm:drawend",
  () => {

    clearToolActive();

  }
);



/* =========================================================
   LOAD DATABASE
========================================================= */

async function loadDatabase() {

  let layersQuery =
    db
      .from(
        "map_layers"
      )
      .select(
        "*"
      )
      .order(
        "sort_order"
      )
      .order(
        "name"
      );


  let shapesQuery =
    db
      .from(
        "map_shapes"
      )
      .select(
        "*"
      )
      .order(
        "created_at"
      );


  if (
    !admin ||
    !editMode
  ) {

    layersQuery =
      layersQuery.eq(
        "visible",
        true
      );


    shapesQuery =
      shapesQuery.eq(
        "published",
        true
      );

  }


  const [
    layersResponse,
    shapesResponse
  ] =
    await Promise.all(
      [

        layersQuery,

        shapesQuery

      ]
    );


  if (
    layersResponse.error
  ) {

    console.error(
      layersResponse.error
    );

    return;

  }


  if (
    shapesResponse.error
  ) {

    console.error(
      shapesResponse.error
    );

    return;

  }


  mapLayers =
    layersResponse.data || [];


  mapShapes =
    shapesResponse.data || [];


  renderLayers();


  renderShapes();


  updateShapeLayerSelect();


  if (
    editMode
  ) {

    status.textContent =
      `${mapLayers.length} couche(s) • ${mapShapes.length} élément(s)`;

  }

}



/* =========================================================
   CLEAR GROUPS
========================================================= */

function clearGroups() {

  for (
    const group
    of Object.values(
      layerGroups
    )
  ) {

    if (
      map.hasLayer(
        group
      )
    ) {

      map.removeLayer(
        group
      );

    }

  }


  layerGroups =
    {};

}



/* =========================================================
   RENDER LAYERS
========================================================= */

function renderLayers() {

  clearGroups();


  layersList.innerHTML =
    "";


  if (
    mapLayers.length === 0
  ) {

    layersList.textContent =
      "Aucune couche.";

    return;

  }


  for (
    const layer
    of mapLayers
  ) {

    const group =
      L.layerGroup();


    layerGroups[
      layer.id
    ] =
      group;


    group.addTo(
      map
    );


    const shapeCount =
      mapShapes.filter(
        shape =>
          shape.layer_id ===
          layer.id
      ).length;


    const label =
      document.createElement(
        "label"
      );


    label.className =
      "layer-item";


    const checkbox =
      document.createElement(
        "input"
      );


    checkbox.type =
      "checkbox";


    checkbox.checked =
      true;


    const color =
      document.createElement(
        "span"
      );


    color.className =
      "layer-color";


    color.style.background =
      layer.color ||
      "#8b5cf6";


    const title =
      document.createElement(
        "span"
      );


    title.className =
      "layer-title";


    title.textContent =
      layer.name;


    const count =
      document.createElement(
        "span"
      );


    count.className =
      "layer-count";


    count.textContent =
      shapeCount;


    checkbox.addEventListener(
      "change",
      () => {

        if (
          checkbox.checked
        ) {

          group.addTo(
            map
          );

        }
        else {

          map.removeLayer(
            group
          );

        }

      }
    );


    label.append(
      checkbox,
      color,
      title,
      count
    );


    layersList.appendChild(
      label
    );

  }

}



/* =========================================================
   RENDER SHAPES
========================================================= */

function renderShapes() {

  renderedShapeLayers =
    [];


  for (
    const shape
    of mapShapes
  ) {

    const parentLayer =
      mapLayers.find(
        layer =>
          layer.id ===
          shape.layer_id
      );


    if (
      !parentLayer ||
      !shape.geometry
    ) {
      continue;
    }


    const color =
      shape.style?.color ||
      parentLayer.color ||
      "#8b5cf6";


    const opacity =
      shape.style?.opacity ??
      parentLayer.opacity ??
      .35;


    const geo =
      L.geoJSON(

        {

          type:
            "Feature",

          geometry:
            shape.geometry

        },

        {

          style: {

            color,

            fillColor:
              color,

            fillOpacity:
              opacity,

            weight:
              shape.style?.weight ??
              3

          }

        }

      );


    geo.eachLayer(
      leafletLayer => {

        leafletLayer.options.pmIgnore =
          false;


        const popup =
          document.createElement(
            "div"
          );


        const title =
          document.createElement(
            "h3"
          );


        title.className =
          "popup-title";


        title.textContent =
          shape.name ||
          "Zone";


        popup.appendChild(
          title
        );


        if (
          shape.description
        ) {

          const description =
            document.createElement(
              "p"
            );


          description.className =
            "popup-description";


          description.textContent =
            shape.description;


          popup.appendChild(
            description
          );

        }


        leafletLayer.bindPopup(
          popup
        );


        leafletLayer.on(
          "click",
          event => {

            if (
              !editMode
            ) {
              return;
            }


            L.DomEvent.stopPropagation(
              event
            );


            selectExistingShape(
              leafletLayer,
              shape
            );

          }
        );


        const group =
          layerGroups[
            shape.layer_id
          ];


        if (
          group
        ) {

          leafletLayer.addTo(
            group
          );

        }


        renderedShapeLayers.push(
          leafletLayer
        );

      }
    );

  }

}



/* =========================================================
   LAYER SELECT
========================================================= */

function updateShapeLayerSelect() {

  shapeLayerInput.innerHTML =
    "";


  if (
    mapLayers.length === 0
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      "";


    option.textContent =
      "Aucune couche";


    shapeLayerInput.appendChild(
      option
    );


    return;

  }


  for (
    const layer
    of mapLayers
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      layer.id;


    option.textContent =
      layer.name;


    shapeLayerInput.appendChild(
      option
    );

  }

}



/* =========================================================
   CREATE SHAPE
========================================================= */

map.on(
  "pm:create",
  event => {

    if (
      !editMode
    ) {

      map.removeLayer(
        event.layer
      );

      return;

    }


    stopDrawing();


    selectedLeafletLayer =
      event.layer;


    temporaryLayer =
      event.layer;


    selectedShapeRecord =
      null;


    shapeNameInput.value =
      "";


    shapeDescriptionInput.value =
      "";


    shapePublishedInput.checked =
      true;


    if (
      mapLayers.length > 0
    ) {

      shapeLayerInput.value =
        mapLayers[0].id;


      shapeColorInput.value =
        mapLayers[0].color ||
        "#8b5cf6";


      shapeOpacityInput.value =
        mapLayers[0].opacity ??
        .35;

    }


    applyShapePreview();


    editorPanel.classList.add(
      "visible"
    );


    status.textContent =
      "Nouvel élément. Choisis son nom puis enregistre.";


    updateButtons();

  }
);



/* =========================================================
   SELECT SHAPE
========================================================= */

function selectExistingShape(
  leafletLayer,
  shape
) {

  if (
    selectedLeafletLayer?.pm
  ) {

    selectedLeafletLayer.pm.disable();

  }


  selectedLeafletLayer =
    leafletLayer;


  selectedShapeRecord =
    shape;


  temporaryLayer =
    null;


  shapeLayerInput.value =
    shape.layer_id;


  shapeNameInput.value =
    shape.name || "";


  shapeDescriptionInput.value =
    shape.description || "";


  shapeColorInput.value =
    shape.style?.color ||
    "#8b5cf6";


  shapeOpacityInput.value =
    shape.style?.opacity ??
    .35;


  shapePublishedInput.checked =
    shape.published === true;


  editorPanel.classList.add(
    "visible"
  );


  status.textContent =
    `Sélection : ${shape.name || "Sans nom"}`;


  updateButtons();

}



/* =========================================================
   STYLE PREVIEW
========================================================= */

function applyShapePreview() {

  if (
    !selectedLeafletLayer ||
    typeof
    selectedLeafletLayer.setStyle
    !== "function"
  ) {
    return;
  }


  selectedLeafletLayer.setStyle({

    color:
      shapeColorInput.value,

    fillColor:
      shapeColorInput.value,

    fillOpacity:
      Number(
        shapeOpacityInput.value
      ),

    weight:
      3

  });

}


shapeColorInput.addEventListener(
  "input",
  applyShapePreview
);


shapeOpacityInput.addEventListener(
  "input",
  applyShapePreview
);



/* =========================================================
   SAVE
========================================================= */

saveShapeButton.addEventListener(
  "click",
  async () => {

    if (
      !selectedLeafletLayer
    ) {
      return;
    }


    if (
      !shapeLayerInput.value
    ) {

      status.textContent =
        "Crée d'abord une couche.";

      return;

    }


    selectedLeafletLayer.pm?.disable();


    const payload = {

      layer_id:
        shapeLayerInput.value,

      name:
        shapeNameInput
          .value
          .trim() ||
        "Sans nom",

      description:
        shapeDescriptionInput
          .value
          .trim(),

      geometry:
        selectedLeafletLayer
          .toGeoJSON()
          .geometry,

      style: {

        color:
          shapeColorInput.value,

        opacity:
          Number(
            shapeOpacityInput.value
          ),

        weight:
          3

      },

      published:
        shapePublishedInput.checked

    };


    status.textContent =
      "Enregistrement...";


    let response;


    if (
      selectedShapeRecord
    ) {

      response =
        await db
          .from(
            "map_shapes"
          )
          .update(
            payload
          )
          .eq(
            "id",
            selectedShapeRecord.id
          );

    }
    else {

      response =
        await db
          .from(
            "map_shapes"
          )
          .insert(
            payload
          );

    }


    if (
      response.error
    ) {

      status.textContent =
        "Erreur : " +
        response.error.message;


      return;

    }


    if (
      temporaryLayer &&
      map.hasLayer(
        temporaryLayer
      )
    ) {

      map.removeLayer(
        temporaryLayer
      );

    }


    selectedLeafletLayer =
      null;


    selectedShapeRecord =
      null;


    temporaryLayer =
      null;


    await loadDatabase();


    updateButtons();


    status.textContent =
      "✓ Élément enregistré.";

  }
);



/* =========================================================
   EDIT VERTICES
========================================================= */

editShapeButton.addEventListener(
  "click",
  () => {

    if (
      !selectedLeafletLayer?.pm
    ) {
      return;
    }


    selectedLeafletLayer.pm.enable({

      snappable:
        true,

      snapDistance:
        30,

      snapVertex:
        true,

      snapSegment:
        true,

      allowSelfIntersection:
        false

    });


    status.textContent =
      "Déplace les sommets. Ils s'accrochent aux points et bords voisins.";


    updateButtons();

  }
);


finishEditButton.addEventListener(
  "click",
  () => {

    selectedLeafletLayer?.pm
      ?.disable();


    status.textContent =
      "Modification terminée. Clique sur Enregistrer.";


    updateButtons();

  }
);



/* =========================================================
   CANCEL
========================================================= */

function cancelSelection() {

  if (
    temporaryLayer &&
    map.hasLayer(
      temporaryLayer
    )
  ) {

    map.removeLayer(
      temporaryLayer
    );

  }


  selectedLeafletLayer
    ?.pm
    ?.disable();


  selectedLeafletLayer =
    null;


  selectedShapeRecord =
    null;


  temporaryLayer =
    null;


  shapeNameInput.value =
    "";


  shapeDescriptionInput.value =
    "";


  updateButtons();

}


cancelSelectionButton.addEventListener(
  "click",
  () => {

    cancelSelection();


    status.textContent =
      "Sélection annulée.";

  }
);



/* =========================================================
   DELETE
========================================================= */

deleteShapeButton.addEventListener(
  "click",
  async () => {

    if (
      !selectedShapeRecord
    ) {
      return;
    }


    if (
      !confirm(
        "Supprimer cet élément ?"
      )
    ) {
      return;
    }


    const {
      error
    } =
      await db
        .from(
          "map_shapes"
        )
        .delete()
        .eq(
          "id",
          selectedShapeRecord.id
        );


    if (
      error
    ) {

      status.textContent =
        "Erreur : " +
        error.message;


      return;

    }


    cancelSelection();


    await loadDatabase();


    status.textContent =
      "Élément supprimé.";

  }
);



/* =========================================================
   CREATE LAYER
========================================================= */

document
  .getElementById(
    "create-layer"
  )
  .addEventListener(
    "click",
    async () => {

      const name =
        document
          .getElementById(
            "new-layer-name"
          )
          .value
          .trim();


      if (
        !name
      ) {

        status.textContent =
          "Entre un nom de couche.";

        return;

      }


      const {
        error
      } =
        await db
          .from(
            "map_layers"
          )
          .insert({

            name,

            kind:
              document
                .getElementById(
                  "new-layer-kind"
                )
                .value,

            color:
              document
                .getElementById(
                  "new-layer-color"
                )
                .value,

            opacity:
              Number(
                document
                  .getElementById(
                    "new-layer-opacity"
                  )
                  .value
              ),

            visible:
              true

          });


      if (
        error
      ) {

        status.textContent =
          "Erreur : " +
          error.message;


        return;

      }


      document
        .getElementById(
          "new-layer-name"
        )
        .value =
          "";


      await loadDatabase();


      status.textContent =
        "✓ Couche créée.";

    }
  );



/* =========================================================
   BUTTON STATES
========================================================= */

function updateButtons() {

  saveShapeButton.disabled =
    !selectedLeafletLayer;


  editShapeButton.disabled =
    !selectedShapeRecord;


  finishEditButton.disabled =
    !(
      selectedLeafletLayer &&
      selectedLeafletLayer.pm &&
      selectedLeafletLayer.pm.enabled()
    );


  cancelSelectionButton.disabled =
    !selectedLeafletLayer;


  deleteShapeButton.disabled =
    !selectedShapeRecord;

}



/* =========================================================
   START
========================================================= */

await refreshAuth();


await loadDatabase();


updateButtons();


setTimeout(
  () => {

    map.invalidateSize();

  },
  300
);


})();

</script>
